<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Projects</title>
<style>
  :root { --bg: #f2f5f1; --ink: #14211a; --muted: #566860; --accent: #12784a; --card: #fff; --line: #d9e0da; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1511; --ink: #e6eee8; --muted: #94a69b; --accent: #38a672; --card: #141d18; --line: #25312a; } }
  body { margin: 0; padding: 48px 16px; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; }
  h1 { margin: 0 0 24px; font-size: 32px; }
  a.card { display: block; padding: 18px 20px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; color: inherit; text-decoration: none; }
  a.card:hover { border-color: var(--accent); }
  a.card b { color: var(--accent); font-size: 20px; }
  p { margin: 6px 0 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Personal Projects</h1>
  <a class="card" href="gridiron-desk/">
    <b>Gridiron Desk</b>
    <p>NFL fantasy research dashboard: player trends, injury fallout, matchups, waiver targets.</p>
  </a>
</main>
</body>
</html>
